name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: backend

jobs:
  test:
    name: Tests and type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Unit, statistical and end-to-end tests
        run: python -m pytest -q
      - name: Type check
        run: python -m mypy backend/worldline --ignore-missing-imports
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Browser modules parse
        run: node tests/ui/check-syntax.mjs

  site:
    name: Build the site and test it in a browser
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Build the site from the committed data (no network)
        run: python -m worldline.cli build --out _site --commit "$GITHUB_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install a headless browser
        run: |
          npm install --no-save --prefix tests/ui playwright@1.56.1
          tests/ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Every page renders cleanly on a phone and a desktop
        run: node tests/ui/smoke.mjs _site --shots _shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: _shots
          retention-days: 7
