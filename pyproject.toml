[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "worldline"
version = "0.2.0"
description = "A live, validated observatory of unusual change in the world's news record (GDELT)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "mypy==1.19.1"]

[project.scripts]
worldline = "worldline.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
